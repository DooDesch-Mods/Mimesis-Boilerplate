name: Build and Release on Tag

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      operation:
        description: Verify packages or repair an existing release
        type: choice
        options: [verify, nexus, requirements]
        default: verify
      version:
        description: Version X.Y.Z (blank uses the latest changelog section for verify)
        type: string
        required: false
      existing_file_uid:
        description: Existing Nexus version UID for requirements repair
        type: string
        required: false

permissions:
  contents: write

jobs:
  template:
    uses: ./.github/workflows/template.yml
  release:
    needs: template
    uses: DooDesch-Mods/.github/.github/workflows/mimesis-release.yml@main
    with:
      project: Boilerplate.csproj
      assembly: Boilerplate
      library: false
      mimicapi: false
      thunderstore: true
      nexus: false
      api_requirement: false
      operation: ${{ github.event_name == 'push' && 'publish' || inputs.operation }}
      version: ${{ inputs.version }}
      existing_file_uid: ${{ inputs.existing_file_uid }}
    secrets:
      WORKSPACE_TOKEN: ${{ secrets.WORKSPACE_TOKEN }}
      THUNDERSTORE_TOKEN: ${{ secrets.THUNDERSTORE_TOKEN }}
      NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
      DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
  source:
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package developer sources
        run: python tools/package_source.py "dist/Boilerplate_${GITHUB_REF_NAME#v}_source.zip"
      - name: Add source kit to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*_source.zip
